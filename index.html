<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heartseed</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14110f; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      #menu { position: fixed; inset: 0; overflow: hidden; background: #10140c; color: #f0e6d2;
        font: 15px/1.4 system-ui, -apple-system, sans-serif; z-index: 10;
        --panel: #1a2013; --line: #33402a; --muted: #a59a84; --gold: #f2c94c; --mastery: #8fd3ff; --leaf: #b8e986; }
      #menu[hidden] { display: none; }
      #menu .muted { color: var(--muted); } #menu .small { font-size: 12.5px; }
      #menu h1 { margin: 0; font: 600 22px/1 ui-monospace, monospace; color: var(--leaf); }
      #menu h2 { margin: 0; font: 600 13px/1 system-ui; text-transform: uppercase; letter-spacing: .12em; color: #cfc4ad; }
      #menu h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #cfc4ad; }
      #menu button { font: inherit; color: #1b1405; background: var(--gold); border: 0; border-radius: 7px; padding: 8px 14px; cursor: pointer; }
      #menu button:disabled { background: #3d3929; color: #857a64; cursor: default; }
      #menu button.secondary { background: #34432a; color: #e6efd8; }
      #menu button.link { background: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 12.5px; }
      .screen { height: 100%; display: grid; grid-template-columns: minmax(330px, 36%) 1fr; grid-template-rows: auto 1fr; gap: 10px;
        padding: 10px max(12px, env(safe-area-inset-left)) 12px; box-sizing: border-box; }
      .topbar { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
      .topbar .summary { margin: 0; } .topbar .mastery { color: var(--mastery); }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-height: 0; display: flex; flex-direction: column; }
      .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .market { overflow-y: auto; gap: 12px; padding-bottom: 14px; }
      .market > :not(.panel-head) { margin: 0 14px; }
      .purse { display: flex; gap: 14px; align-items: center; font-weight: 600; }
      .coin { display: inline-flex; align-items: center; gap: 4px; color: var(--gold); }
      .coin b { margin-left: 4px; }
      #menu .mastery { color: var(--mastery); font-weight: 600; }
      .pip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--gold); display: inline-block; box-sizing: border-box; }
      .pip.full { background: var(--gold); }
      .offers { display: grid; grid-template-columns: repeat(var(--slots, 3), minmax(0, 1fr)); gap: 10px; }
      #menu .offer { position: relative; background: #241f14; border: 1px solid #5a4b2c; border-radius: 10px; padding: 12px 8px 30px; color: #f0e6d2;
        display: grid; justify-items: center; gap: 4px; text-align: center; transition: transform .12s, border-color .12s; }
      #menu .offer:not(:disabled):hover { transform: translateY(-3px); border-color: var(--gold); }
      #menu .offer:disabled { background: #1d1a12; color: #8a7f6a; } #menu .offer:disabled .pack-art { filter: grayscale(.7) brightness(.7); }
      .pack-art { position: relative; width: 46px; height: 62px; margin-bottom: 4px; }
      .pack-art i { position: absolute; inset: 0; border-radius: 6px; background: linear-gradient(160deg, #9be36d, #3f6e2a); border: 2px solid #d9f5bf;
        box-shadow: 0 3px 8px #0008; }
      .pack-art i::after { content: ''; position: absolute; left: 4px; right: 4px; top: 7px; height: 3px; background: #ffffff55; border-radius: 2px; }
      .bundle .pack-art i:nth-child(1) { transform: translate(-10px, 3px) rotate(-10deg); }
      .bundle .pack-art i:nth-child(3) { transform: translate(10px, 3px) rotate(10deg); }
      .grove .pack-art i { background: linear-gradient(160deg, #c084fc, #4c1d95); border-color: #e9d5ff; }
      .offer-name { font-weight: 600; font-size: 14px; } .offer-sub { font-size: 12px; color: var(--muted); }
      .offer-odds { font-size: 11px; color: #c084fc; }
      .deal { display: inline-block; margin-top: 2px; background: #3f6e2a; color: #e6ffd0; border-radius: 4px; padding: 0 5px; font-size: 11px; }
      .price { position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #1b1405; font-weight: 700;
        padding: 3px 12px 3px 14px; border-radius: 6px 6px 0 0; display: inline-flex; gap: 5px; align-items: center;
        clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px); }
      .price .pip { border-color: #1b1405; background: #1b1405; width: 9px; height: 9px; }
      #menu .offer:disabled .price { background: #4a4434; color: #8a7f6a; }
      .offer.sold { display: grid; place-items: center; border: 1px dashed #4a3f28; border-radius: 10px; color: #6a5a3a; font: 700 14px monospace; letter-spacing: .2em; min-height: 140px; }
      .offer.sold span { transform: rotate(-12deg); border: 2px solid #6a5a3a; padding: 2px 8px; }
      #menu .reroll { justify-self: center; align-self: center; } .reroll small { opacity: .75; }
      .sub-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 4px !important; }
      .combs { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      #menu .comb { position: relative; width: 74px; height: 66px; padding: 0; background: none; color: #f0e6d2; display: grid; place-items: center; }
      #menu .comb:disabled { background: none; color: #f0e6d2; }
      .comb svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .comb .cell { fill: #2a2214; stroke: #ff9f43; stroke-width: .06; }
      .comb .fill { fill: #ff9f43; opacity: .45; clip-path: inset(calc((1 - var(--p)) * 100%) 0 0 0); transition: clip-path .5s; }
      .comb.ready .cell { fill: #5a3a10; stroke: #ffd27a; stroke-width: .1; } .comb.ready { animation: bob 1s ease-in-out infinite; }
      .comb.locked svg polygon { fill: #1f1f17; stroke: #4a4434; stroke-width: .05; stroke-dasharray: .12 .08; }
      #menu .comb.locked { width: auto; min-width: 74px; padding: 0 12px; }
      .comb-text { position: relative; display: grid; justify-items: center; line-height: 1.1; font-size: 18px; }
      .comb-text small { font-size: 11px; font-weight: 600; }
      .comb.locked .comb-text small { color: var(--muted); max-width: 90px; }
      @keyframes bob { 50% { transform: translateY(-3px); } }
      .team { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
      .chip { border: 2px solid var(--tag, #444); border-radius: 8px; padding: 5px; font-size: 11.5px; display: grid; gap: 1px; min-height: 40px; background: #12160d; }
      .chip.empty { border: 2px dashed #34402a; background: none; }
      .chip .stars { color: #f5d76e; }
      .chip.foil { background: linear-gradient(135deg, #12160d 30%, #4a4a3a 50%, #12160d 70%); }
      .chip.holo { background: linear-gradient(135deg, #1c2a3a, #3a1c3a, #2a3a1c); }
      .progress { overflow: hidden; }
      .progress nav { display: flex; gap: 4px; background: #11150c; padding: 3px; border-radius: 9px; }
      #menu .progress nav button { background: none; color: var(--muted); padding: 6px 14px; }
      #menu .progress nav button.on { background: #2f3a24; color: #f0e6d2; }
      .graph-wrap { position: relative; flex: 1; min-height: 0; }
      .graph { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: manipulation; user-select: none; }
      .edge { stroke: #3a4430; stroke-width: .07; stroke-linecap: round; }
      .edge.open { stroke: color-mix(in srgb, var(--c) 40%, #3a4430); }
      .edge.lit { stroke: var(--c); stroke-width: .1; filter: drop-shadow(0 0 .08px var(--c)); }
      .edge.shut { stroke-dasharray: .1 .12; }
      .blabel { font: 700 .3px system-ui; letter-spacing: .03px; text-transform: uppercase; dominant-baseline: middle; }
      .seed { cursor: pointer; } .seed circle { fill: #2d3a22; stroke: var(--leaf); stroke-width: .06; }
      .seed .seed-core { fill: #3f6e2a; stroke: none; }
      .tnode { cursor: pointer; }
      .tnode .cell { fill: #1c2216; stroke: color-mix(in srgb, var(--c) 45%, #222); stroke-width: .05; transition: fill .15s; }
      .tnode .halo { fill: none; stroke: none; }
      .tnode:hover .cell { fill: #2a3220; }
      .tnode.owned .cell { fill: color-mix(in srgb, var(--c) 22%, #1c2216); stroke: var(--c); stroke-width: .07; }
      .tnode.maxed .cell { fill: color-mix(in srgb, var(--c) 45%, #1c2216); stroke: var(--c); stroke-width: .08; }
      .tnode.locked .cell { fill: #15180f; stroke: #34382c; stroke-dasharray: .08 .06; }
      .tnode.locked .icon { opacity: .35; }
      .tnode.afford .halo { stroke: var(--c); stroke-width: .045; animation: glow 1.6s ease-in-out infinite; }
      .tnode.sel .halo { stroke: #fff; stroke-width: .05; animation: none; }
      @keyframes glow { 50% { opacity: .25; } }
      .icon { font-size: .36px; text-anchor: middle; dominant-baseline: central; pointer-events: none; fill: #ddd; }
      .lock { font-size: .2px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
      .lvl rect { fill: #0d100a; stroke: #3a4430; stroke-width: .02; } .lvl .lvl-fill { fill: var(--c); stroke: none; opacity: .85; }
      .lvl text { font: 700 .15px ui-monospace, monospace; fill: #fff; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: #0008; stroke-width: .03px; }
      .tnode.locked .lvl { opacity: .5; }
      .detail { flex: 1; min-width: 0; max-width: 560px; min-height: 64px; background: #12160d; border: 1px solid var(--c, var(--line)); border-radius: 12px;
        padding: 8px 12px; display: grid; gap: 5px; box-sizing: border-box; align-content: center; }
      .detail .detail-body { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .head-right { display: flex; gap: 14px; align-items: center; }
      .detail.intro { gap: 3px; }
      .detail p { margin: 0; font-size: 13.5px; }
      .detail-top { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; }
      .detail-act { max-width: 170px; }
      .detail-icon { font-size: 26px; width: 40px; height: 40px; display: grid; place-items: center; background: #1c2216; border-radius: 8px; border: 1px solid var(--c); }
      #menu .detail .close { background: none; color: var(--muted); font-size: 20px; padding: 0 4px; align-self: start; }
      #menu .detail button[data-buy-node] { background: var(--mastery); justify-self: start; font-weight: 600; }
      #menu .detail button[data-buy-node]:disabled { background: #2e3a40; color: #7f9aa6; }
      .needs { color: var(--muted); font-size: 13px; } .maxed { color: var(--leaf); font-weight: 600; }
      .progress-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
      #menu button.battle { background: linear-gradient(180deg, #ff6b4a, #c2361b); color: #fff; font: 800 22px/1 system-ui; letter-spacing: .08em; text-transform: uppercase;
        padding: 12px 34px; border-radius: 12px; box-shadow: 0 4px 0 #7a1d0c, 0 0 24px #ff6b4a55; display: grid; justify-items: center; gap: 3px; }
      #menu button.battle small { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: none; opacity: .85; }
      #menu button.battle:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a1d0c; }
      .collection { flex: 1; overflow-y: auto; padding: 12px 14px; display: grid; gap: 10px; align-content: start; }
      .collection p { margin: 0; } #menu .collection .link { justify-self: start; }
      .ccards { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
      .ccard { aspect-ratio: 5 / 7; border-radius: 10px; border: 3px solid #666; background: var(--tag, #222); color: #111; padding: 8px; box-sizing: border-box;
        display: grid; align-content: center; justify-items: center; text-align: center; gap: 4px; position: relative; overflow: hidden; }
      .ccard.r-rare { border-color: #3b82f6; } .ccard.r-epic { border-color: #a855f7; } .ccard.r-legendary { border-color: #f5b301; }
      .ccard.unknown { background: #161a10; color: #555; } .ccard .q { font: 700 36px monospace; color: #3a4430; }
      .ccard.foil::before, .card.foil .face::before { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, #fff8 48%, transparent 66%);
        background-size: 250% 100%; animation: sheen 2.4s linear infinite; pointer-events: none; }
      .ccard.holo::before, .card.holo .face::before { content: ''; position: absolute; inset: 0; mix-blend-mode: overlay; pointer-events: none;
        background: linear-gradient(115deg, #ff6b6b, #ffd93d, #6bff95, #6bc5ff, #c56bff, #ff6b6b); background-size: 300% 100%; animation: sheen 3s linear infinite; }
      @keyframes sheen { from { background-position: 150% 0; } to { background-position: -150% 0; } }
      .vdots { display: flex; gap: 4px; margin-top: 4px; }
      .vdot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #0006; opacity: .3; }
      .vdot.have { opacity: 1; } .vdot.standard { background: #ddd; } .vdot.foil { background: linear-gradient(135deg, #fff, #aaa); } .vdot.holo { background: conic-gradient(#f66, #fd3, #6f9, #6cf, #c6f, #f66); }
      .ccard.unknown .vdot { border-color: #3a4430; }
      .odds { border-collapse: collapse; font-size: 13px; } .odds th, .odds td { padding: 4px 10px; text-align: right; border-bottom: 1px solid var(--line); }
      .odds th:first-child { text-align: left; } .odds th { text-transform: capitalize; font-weight: 600; }
      .odds .r-rare { color: #60a5fa; } .odds .r-epic { color: #c084fc; } .odds .r-legendary { color: #f5b301; }
      .reveal { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: grid; place-items: center; align-content: center; gap: 16px; padding: 16px; }
      .card { width: 190px; height: 260px; perspective: 800px; position: relative; cursor: pointer; }
      .card .back, .card .face { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; transition: transform .35s; display: grid; place-items: center; overflow: hidden; }
      .card .back { background: #2b2433; border: 4px solid var(--gold); font: 700 48px monospace; color: var(--gold); }
      .card .face { transform: rotateY(180deg); background: var(--tag); color: #111; border: 6px solid #666; align-content: center; gap: 6px; text-align: center; padding: 10px; }
      .card .vtag { background: #111; color: #fff; border-radius: 4px; padding: 2px 6px; font-size: 12px; position: relative; }
      .card.flipped .back { transform: rotateY(180deg); } .card.flipped .face { transform: rotateY(360deg); }
      .card.rare .back { box-shadow: 0 0 28px 6px #3b82f6; } .card.rare .face { border-color: #3b82f6; }
      .card.epic .back { box-shadow: 0 0 34px 10px #a855f7; } .card.epic .face { border-color: #a855f7; }
      .card.legendary .back { box-shadow: 0 0 44px 14px #f5b301; animation: shake .3s 2; } .card.legendary .face { border-color: #f5b301; }
      @keyframes shake { 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }
      .swap { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 600px; }
      @media (max-width: 820px) {
        #menu { overflow-y: auto; }
        .screen { height: auto; grid-template-columns: 1fr; }
        .market { overflow: visible; }
        .graph-wrap { flex: none; overflow-x: auto; }
        .graph { position: relative; display: block; width: 760px; height: 540px; }
        .detail-top { grid-template-columns: auto 1fr auto; } .detail-act { grid-column: 1 / -1; max-width: none; } #menu .detail .close { grid-row: 1; grid-column: 3; }
        .progress-foot { flex-wrap: wrap; } .detail { flex-basis: 100%; max-width: none; } #menu button.battle { flex: 1; }
      }
      @media (max-width: 480px) { .offers { gap: 6px; } .team { grid-template-columns: repeat(3, 1fr); } #menu button.battle { padding: 10px 22px; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
